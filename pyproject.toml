[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scientific-plotting-template"
version = "0.1.0"
description = "A modern Python data analysis and visualization workspace"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "xeri chen", email = "xeri_chen@163.com"}
]
dependencies = [
    # 数据处理 (核心)
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # 可视化 (核心)
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    
    # 统计分析 (核心)
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    
    # 机器学习 (核心)
    "scikit-learn>=1.3.0",
    
    # 实用工具
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
viz = [
    # 高级可视化
    "plotly>=5.15.0",
    "bokeh>=3.2.0",
]

ml-advanced = [
    # 高级机器学习
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
]

io = [
    # 数据 I/O
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pyarrow>=12.0.0",
    "fastparquet>=2023.7.0",
]

geo = [
    # 地理空间
    "geopandas>=0.13.0",
    "folium>=0.14.0",
]

interactive = [
    # 交互式分析
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
    "notebook>=7.0.0",
]

stats-advanced = [
    # 高级统计
    "pingouin>=0.5.0",
]

polars = [
    # Polars 后端 (可选)
    "polars>=0.18.0",
]

dev = [
    # 代码格式化
    "ruff>=0.0.280",
    "black>=23.7.0",
    "isort>=5.12.0",

    # 类型检查
    "mypy>=1.4.0",
    "pyright>=1.1.0",

    # 测试
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",

    # 文档
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.1.0",

    # 其他开发工具
    "pre-commit>=3.3.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
]

docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.23.0",
    "myst-parser>=2.0.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "hypothesis>=6.80.0",
]

[project.scripts]
spt = "scientific_template.cli:main"

[project.urls]
Homepage = "https://github.com/XeriChen/scientific-plotting-template"
Documentation = "https://scientific-plotting-template.readthedocs.io"
Repository = "https://github.com/XeriChen/scientific-plotting-template"
Issues = "https://github.com/XeriChen/scientific-plotting-template/issues"

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "C90", "I", "N", "UP", "YTT", "ANN", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "EM", "ERA", "EXE", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "T20", "TRY", "UP", "ARG", "DJ", "FA", "ICN", "INT", "Q", "T10", "TID", "W"]
ignore = ["E501", "ANN101", "ANN102", "ANN401", "S101", "PLR0913", "PLR0915", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004"]
"examples/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
minversion = "7.4.0"
addopts = "-ra -q --cov=scientific_template --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["scientific_template"]
branch = true
omit = ["*/__init__.py", "*/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.hatch.version]
path = "pyproject.toml"

[tool.hatch.build.targets.sdist]
include = ["src/scientific_template", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
include = ["src/scientific_template"]

